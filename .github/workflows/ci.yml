name: Container CI

on:
    push:
        branches: [main]
    workflow_dispatch:
    pull_request:
permissions:
    contents: read
jobs:
    container-checks:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            CHATHAT_DB_PASSWORD: ci-only-db-password
            CHATHAT_PGADMIN_PASSWORD: ci-only-pgadmin-password
            CHATHAT_DEV_PORT: "8000"
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Validate Compose configuration
              run: docker compose -f compose.yaml -f compose.dev.yaml -f compose.ci.yaml config --quiet
            - name: Build and start the stack
              run: docker compose -f compose.yaml -f compose.dev.yaml -f compose.ci.yaml up --build -d --wait --wait-timeout 120 nginx
            - name: Check the Nginx entry point
              run: curl --fail --silent --show-error http://127.0.0.1:8000/health
            - name: Lint
              run: docker compose -f compose.yaml -f compose.dev.yaml exec -T api ruff check src migrations
            - name: Type check
              run: docker compose -f compose.yaml -f compose.dev.yaml exec -T api mypy
            - name: Run pytest
              shell: bash
              run: |
                  mkdir -p ci-artifacts
                  script --quiet --return \
                      --command 'docker compose -f compose.yaml -f compose.dev.yaml exec api python -m pytest -v' \
                      /dev/null < /dev/null | tee ci-artifacts/pytest.log
            - name: Collect Compose diagnostics
              if: ${{ always() }}
              run: |
                  mkdir -p ci-artifacts
                  docker compose -f compose.yaml -f compose.dev.yaml -f compose.ci.yaml ps --all \
                      > ci-artifacts/compose-status.log 2>&1
                  docker compose -f compose.yaml -f compose.dev.yaml -f compose.ci.yaml logs --no-color \
                      > ci-artifacts/compose-services.log 2>&1
            - name: Upload diagnostics
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: container-ci-diagnostics
                  path: ci-artifacts/
                  retention-days: 2
            - name: Stop the CI stack
              if: ${{ always() }}
              run: docker compose -f compose.yaml -f compose.dev.yaml -f compose.ci.yaml down

[project]
name = "chathat"
version = "0.1.0"
description = "A multi-tenant AI website chatbot platform"
readme = "README.md"
authors = [{ name = "EslamKamel89", email = "eslam_kamel_89@hotmail.com" }]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162.4", "pydantic>=2.14.3", "uvicorn>=0.54.0"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

services:
  api:
    environment:
      CHATHAT_ENVIRONMENT: development
      CHATHAT_DEBUG: "${CHATHAT_DEBUG:-false}"
    command:
      - uvicorn
      - chathat.main:create_app
      - --factory
      - --lifespan
      - "on"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "172.30.0.10"
      - --reload
      - --reload-dir
      - /app/src
    volumes:
      - ./src:/app/src:ro

  nginx:
    ports:
      - "127.0.0.1:${CHATHAT_DEV_PORT:-8000}:80"

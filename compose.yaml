services:
  api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx:1.28-alpine
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.0.10
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/static:/srv/chathat/static:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/health
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  db:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: chathat
      POSTGRES_PASSWORD: "${CHATHAT_DB_PASSWORD:?Set CHATHAT_DB_PASSWORD in .env}"
      POSTGRES_DB: chathat
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres_data:
